name: Générer et publier le site

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "duckdb>=1.1"
      - name: Télécharger les DECP consolidées
        run: curl -sS -L --fail --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 -C - -o decp.parquet "https://www.data.gouv.fr/api/1/datasets/r/11cea8e8-df3e-4ed1-932b-781e2635e432"
      - name: Générer le site
        env:
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
        run: python scripts/build.py --parquet decp.parquet --out public
      - name: Enregistrer le rapport de schéma
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schema_report.json || true
          git diff --cached --quiet || (git commit -m "Rapport de génération" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
